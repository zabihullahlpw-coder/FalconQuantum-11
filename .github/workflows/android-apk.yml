name: Build Falcon Quantum 11.0.2 exact-swap safety-preview APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Run regression checks
        run: bash tests/run.sh
      - name: Run synthetic replay
        run: python3 tests/smoke_replay.py
      - name: Compile and package debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK signature and identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p apk-delivery
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "${apks[0]}"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "${apks[0]}" > apk-delivery/apk-metadata.txt
          python3 - <<'PYAPK'
          from pathlib import Path
          first = Path('apk-delivery/apk-metadata.txt').read_text().splitlines()[0]
          assert "name='com.falcon.quantum.audit'" in first, first
          assert "versionCode='11002'" in first, first
          assert "versionName='11.0.2-exact-swap-safety-preview-debug'" in first, first
          PYAPK
          cp "${apks[0]}" apk-delivery/FalconQuantum-11.0.2-exact-swap-safety-preview-debug.apk
          (cd apk-delivery && sha256sum FalconQuantum-11.0.2-exact-swap-safety-preview-debug.apk > SHA256.txt)
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FalconQuantum-11.0.2-exact-swap-apk
          path: apk-delivery/
          if-no-files-found: error
          retention-days: 14
