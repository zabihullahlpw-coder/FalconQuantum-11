plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.falcon.quantum'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.falcon.quantum'
        minSdk 24
        targetSdk 34
        versionCode 11003
        versionName '11.0.3-paper-leverage-safety-preview'
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug {
            applicationIdSuffix '.audit'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            // Original owner must supply release signing outside this archive.
        }
    }
}

tasks.named('wrapper') {
    gradleVersion = '8.7'
    distributionType = Wrapper.DistributionType.BIN
}
